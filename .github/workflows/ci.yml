name: CI

on:
  push:
    branches: [dev-back, main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - name: Build & Test
        run: mvn clean verify -B
